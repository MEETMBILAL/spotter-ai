name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DJANGO_DEBUG: "true"
          MAPBOX_SERVER_TOKEN: "test-token-ci"
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend Tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build (verify no source maps in output)
        env:
          VITE_MAPBOX_PUBLIC_TOKEN: "pk.test-token-ci"
        run: |
          npm run build
          if find dist -name "*.map" | grep -q .; then
            echo "ERROR: Source maps found in production build!"
            exit 1
          fi
          echo "✅ No source maps in production build"
