      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <path d="M 100 400 Q 400 200 700 350 Q 900 450 1100 300" stroke="#1f6feb" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
